<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="GAC 大湾区智慧出行企划项目详情">
  <title>大湾区智慧出行企划 | 段皓凡作品集</title>
  <script>
    document.documentElement.classList.add('js');
    try{
      if(sessionStorage.getItem('gac-detail-enter')==='1'){
        document.documentElement.classList.add('page-entering');
        sessionStorage.removeItem('gac-detail-enter');
      }
    }catch(error){}
  </script>
  <style>
    :root{--bg:#f8f8fc;--surface:#fbfbfd;--text:#111;--muted:#696872;--line:rgba(17,17,17,.11);--accent:#ff6082;--gutter:clamp(20px,3.5vw,64px);--content:1600px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;opacity:1;transition:opacity .46s ease}
    .page-entering body{opacity:0}
    a{color:inherit;text-decoration:none}
    .project-head{position:relative;padding:0 var(--gutter) 0;background:var(--surface);overflow:hidden}
    .project-head::before{content:"";position:absolute;inset:0 0 auto;height:clamp(76px,8vw,112px);background:linear-gradient(90deg,rgba(168,148,242,.78),rgba(220,123,205,.76),rgba(255,96,130,.74),rgba(110,188,240,.72));background-size:220% 100%;animation:tide-bar 12s ease-in-out infinite alternate}
    .project-head::after{content:"";position:absolute;inset:0 0 auto;height:clamp(76px,8vw,112px);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(248,248,252,.34));backdrop-filter:blur(12px) saturate(1.12);pointer-events:none}
    .project-head img{display:block;width:100%;height:auto;border-radius:10px;transform:scale(1);transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .55s ease}
    .page-entering .project-head img{transform:scale(1.008);opacity:.82}
    .head-media{position:relative;z-index:1;padding-top:clamp(76px,8vw,112px)}
    .back-home{position:absolute;z-index:2;top:calc(clamp(76px,8vw,112px)/2);left:var(--gutter);display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border:1px solid rgba(17,17,17,.1);border-radius:999px;background:#fff;box-shadow:0 8px 22px rgba(31,31,44,.06);font-size:13px;font-weight:700;letter-spacing:.08em;transform:translateY(-50%);transition:transform .25s,background .25s}
    .back-home:hover{transform:translateY(-50%) translateX(-4px);background:#fff}
    .back-home:focus-visible{outline:3px solid #315efb;outline-offset:5px}
    .project-intro{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,2vw,36px);max-width:var(--content);margin:0 auto;padding:clamp(72px,7vw,112px) var(--gutter) clamp(44px,4.5vw,72px)}
    .intro-heading{grid-column:1/8}
    .meta{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    h1{max-width:10ch;margin:18px 0 10px;font-size:clamp(48px,6.5vw,104px);line-height:.94;letter-spacing:-.055em}
    .project-en{margin:0;color:var(--muted);font-size:clamp(12px,1vw,15px);letter-spacing:.07em;text-transform:uppercase}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
    .tags span{padding:6px 11px;border-radius:999px;background:rgba(255,96,130,.12);font-size:11px}
    .intro-copy{grid-column:9/13;align-self:end}
    .intro-copy p{margin:0;color:var(--muted);font-size:clamp(16px,1.35vw,21px);line-height:1.7}
    .project-pages{padding:clamp(36px,4vw,64px) var(--gutter) clamp(80px,10vw,160px)}
    .page-section{max-width:var(--content);margin:0 auto;padding:clamp(48px,5.2vw,84px) 0}
    .js .page-section{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
    .page-section:first-child{padding-top:0}
    .page-section+.page-section{border-top:1px solid var(--line)}
    .js .page-section.visible{opacity:1;transform:none}
    .page-section figure{margin:0}
    .page-section img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 12px 36px rgba(45,45,60,.045)}
    figcaption{display:flex;justify-content:space-between;gap:24px;margin-top:16px;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
    .project-end{display:flex;justify-content:space-between;align-items:center;max-width:var(--content);margin:0 auto;padding-top:32px;border-top:1px solid var(--line)}
    .project-end a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;letter-spacing:.08em}
    .project-end span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    @keyframes tide-bar{from{background-position:0% 50%;filter:saturate(1)}to{background-position:100% 50%;filter:saturate(1.18)}}
    @media(max-width:760px){
      .project-head::before,.project-head::after{height:72px}
      .head-media{padding-top:72px}
      .back-home{top:36px;left:20px;min-height:44px;padding:0 17px;background:#fff}
      .project-intro{display:block;padding-top:58px;padding-bottom:36px}
      h1{font-size:clamp(42px,13vw,68px)}
      .intro-copy{margin-top:42px}
      .project-pages{padding-top:32px}
      .page-section{padding:42px 0}.js .page-section{transform:translateY(16px)}
      .page-section img,.project-head img{border-radius:8px}
      figcaption{font-size:9px}
      .project-end{align-items:flex-start;flex-direction:column;gap:24px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.back-home,.project-head img,.page-section,body{transition:none}.project-head::before{animation:none}.js .page-section{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="project-head">
    <a class="back-home" href="index.html#project-2" aria-label="返回作品集主页">◀ 返回主页</a>
    <div class="head-media"><img src="assets/project-gac-mobility.png?v=g2" alt="GAC 大湾区智慧出行企划封面"></div>
  </header>

        <figcaption><span>角色定位与视频流程</span><span>02 / 09</span></figcaption>

        <figcaption><span>项目流程与协同记录</span><span>03 / 09</span></figcaption>

    <section class="page-section">

        <figcaption><span>立体城市交通沙盘</span><span>05 / 09</span></figcaption>
      </figure>
    </section>
    <section class="page-section">

    <div class="project-end"><span>End of project</span><a href="index.html#project-2">返回作品集</a></div>
  </main>
  <script>
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('page-entering')));
    const sections=[...document.querySelectorAll('.page-section')];
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){
      sections.forEach(section=>section.classList.add('visible'));
    }else{
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },{threshold:.08,rootMargin:'0px 0px -8% 0px'});
      sections.forEach(section=>observer.observe(section));
    }
  </script>

</html>
