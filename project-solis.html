<!doctype html>

  <script>

      if(sessionStorage.getItem('solis-detail-enter')==='1'){

  <style>
    :root{--bg:#f8f8fc;--surface:#fbfbfd;--text:#111;--muted:#696872;--line:rgba(17,17,17,.11);--accent:#FDE273;--accent-ink:#111;--gutter:clamp(20px,3.5vw,64px);--content:1600px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;opacity:1;transition:opacity .46s ease}.page-entering body{opacity:0}a{color:inherit;text-decoration:none}
    .project-head{position:relative;padding:0 var(--gutter);background:var(--surface);overflow:hidden}.project-head::before{content:"";position:absolute;inset:0 0 auto;height:clamp(76px,8vw,112px);background:linear-gradient(90deg,rgba(253,226,115,.9),rgba(249,236,168,.82),rgba(178,222,236,.78),rgba(129,199,239,.76));background-size:220% 100%;animation:tide-bar 12s ease-in-out infinite alternate}.project-head::after{content:"";position:absolute;inset:0 0 auto;height:clamp(76px,8vw,112px);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(248,248,252,.30));backdrop-filter:blur(12px) saturate(1.12);pointer-events:none}
    .head-media{position:relative;z-index:1;padding-top:clamp(76px,8vw,112px)}.project-head img{display:block;width:100%;height:auto;border-radius:10px;transform:scale(1);transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .55s ease}.page-entering .project-head img{transform:scale(1.008);opacity:.82}
    .back-home{position:absolute;z-index:2;top:calc(clamp(76px,8vw,112px)/2);left:var(--gutter);display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border:1px solid rgba(17,17,17,.1);border-radius:999px;background:#fff;box-shadow:0 8px 22px rgba(31,31,44,.06);font-size:13px;font-weight:700;letter-spacing:.08em;transform:translateY(-50%);transition:transform .25s,background .25s}.back-home:hover{transform:translateY(-50%) translateX(-4px);background:#fff}.back-home:focus-visible{outline:3px solid #315efb;outline-offset:5px}
    .project-intro{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,2vw,36px);max-width:var(--content);margin:0 auto;padding:clamp(72px,7vw,112px) var(--gutter) clamp(44px,4.5vw,72px)}.intro-heading{grid-column:1/8}.meta{font-size:12px;letter-spacing:.14em;text-transform:uppercase}h1{max-width:12ch;margin:18px 0 10px;font-size:clamp(44px,5.8vw,92px);line-height:.96;letter-spacing:-.055em}.project-en{margin:0;color:var(--muted);font-size:clamp(12px,1vw,15px);letter-spacing:.07em;text-transform:uppercase}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.tags span{padding:6px 11px;border-radius:999px;background:rgba(253,226,115,.32);font-size:11px}.intro-copy{grid-column:9/13;align-self:end}.intro-copy p{margin:0;color:var(--muted);font-size:clamp(16px,1.35vw,21px);line-height:1.7}
    .project-pages{padding:clamp(36px,4vw,64px) var(--gutter) clamp(80px,10vw,160px)}.page-section{max-width:var(--content);margin:0 auto;padding:clamp(48px,5.2vw,84px) 0}.js .page-section{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}.page-section:first-child{padding-top:0}.page-section+.page-section{border-top:1px solid var(--line)}.js .page-section.visible{opacity:1;transform:none}.page-section figure{margin:0}.page-section img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 12px 36px rgba(45,45,60,.045)}figcaption{display:flex;justify-content:space-between;gap:24px;margin-top:16px;color:var(--muted);font-size:11px;letter-spacing:.1em}.project-end{display:flex;justify-content:space-between;align-items:center;max-width:var(--content);margin:0 auto;padding-top:32px;border-top:1px solid var(--line)}.project-end a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;letter-spacing:.08em}.project-end span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    @keyframes tide-bar{from{background-position:0% 50%;filter:saturate(1)}to{background-position:100% 50%;filter:saturate(1.18)}}@media(max-width:760px){.project-head{padding:0 20px}.project-head::before,.project-head::after{height:72px}.head-media{padding-top:72px}.back-home{top:36px;left:20px;min-height:44px;padding:0 17px;background:#fff}.project-intro{display:block;padding-top:58px;padding-bottom:36px}h1{font-size:clamp(40px,12vw,64px)}.intro-copy{margin-top:42px}.project-pages{padding:32px 20px 92px}.page-section{padding:42px 0}.js .page-section{transform:translateY(16px)}.page-section img,.project-head img{border-radius:8px}figcaption{font-size:9px}.project-end{align-items:flex-start;flex-direction:column;gap:24px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.back-home,.project-head img,.page-section,body{transition:none}.project-head::before{animation:none}.js .page-section{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="project-head">

  <section class="project-intro" aria-labelledby="project-title">

      <h1 id="project-title">SOLIS-VAULT 家用储能电池设计</h1>

      <div class="tags"><span>模块化设计</span><span>家庭储能</span></div>
    </div>
    <div class="intro-copy"><p>面向家庭节能、应急供电与户外便携场景，构建可拆分储能电池与太阳能补能系统，通过模块化组合、模式切换和数据管理提升家庭储能的日常可用性。</p></div>
  </section>
  <main class="project-pages" aria-label="SOLIS-VAULT 家用储能电池设计完整作品">
    <section class="page-section"><figure><img src="assets/solis-project-02.png?v=e5" alt="SOLIS-VAULT 项目第2页"><figcaption><span>绿色储能背景与用电机会</span><span>01 / 07</span></figcaption></figure></section>
    <section class="page-section"><figure><img src="assets/solis-project-03.png?v=e5" alt="SOLIS-VAULT 项目第3页"><figcaption><span>目标用户与需求痛点</span><span>02 / 07</span></figcaption></figure></section>
    <section class="page-section"><figure><img src="assets/solis-project-04.png?v=e5" alt="SOLIS-VAULT 项目第4页"><figcaption><span>产品定义与方案方向</span><span>03 / 07</span></figcaption></figure></section>
    <section class="page-section"><figure><img src="assets/solis-project-05.png?v=e5" alt="SOLIS-VAULT 项目第5页"><figcaption><span>使用流程与功能架构</span><span>04 / 07</span></figcaption></figure></section>
    <section class="page-section"><figure><img src="assets/solis-project-06.png?v=e5" alt="SOLIS-VAULT 项目第6页"><figcaption><span>产品概述与设计特征</span><span>05 / 07</span></figcaption></figure></section>
    <section class="page-section"><figure><img src="assets/solis-project-07.png?v=e5" alt="SOLIS-VAULT 项目第7页"><figcaption><span>充放电模式与场景展示</span><span>06 / 07</span></figcaption></figure></section>
    <section class="page-section"><figure><img src="assets/solis-project-08.png?v=e5" alt="SOLIS-VAULT 项目第8页"><figcaption><span>小程序交互与数据监测</span><span>07 / 07</span></figcaption></figure></section>
    <div class="project-end"><span>End of project</span><a href="index.html#project-5">返回作品集</a></div>
  </main>
  <script>
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('page-entering')));
    const sections=[...document.querySelectorAll('.page-section')];
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){sections.forEach(section=>section.classList.add('visible'))}else{const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target)}})},{threshold:.08,rootMargin:'0px 0px -8% 0px'});sections.forEach(section=>observer.observe(section))}
  </script>
